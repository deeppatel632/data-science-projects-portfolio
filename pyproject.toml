[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["projects"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["F401"]
"**/__init__.py" = ["F401"]
